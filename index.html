<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Narrow</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--acc:#35d07f;--tint:transparent;--tint2:transparent;--glow:255,255,255}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:#000;color:#fff;font-family:'Nunito',system-ui,'Segoe UI',sans-serif;font-weight:700;overflow:hidden;text-shadow:0 1px 6px #0006;
 display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
#bg{position:fixed;inset:-20px;width:calc(100% + 40px);height:calc(100% + 40px);object-fit:cover;filter:blur(5px) saturate(1.1);z-index:-3;opacity:0;transition:opacity 1.2s;background:#000}
#bg.on{opacity:1}
#tint{position:fixed;inset:0;z-index:-2;background:linear-gradient(var(--tint),var(--tint2));transition:background 2s}
body[data-w=sunny]{--acc:#ffb62e;--tint:#ffd27a22;--tint2:#ff8a3d1c}
body[data-w=night]{--acc:#7aa2ff;--tint:#050a2a88;--tint2:#0b0f3a66}
body[data-w=cloudy]{--acc:#8fc3e6;--tint:#9fb4c533;--tint2:#5b6b7a33}
body[data-w=rain]{--acc:#6fb3e8;--tint:#2a3f5a55;--tint2:#101d2e66}
body[data-w=fog]{--acc:#b9cbd6;--tint:#c9d3d933;--tint2:#7b889044}
body[data-w=snow]{--acc:#bfe6ff;--tint:#dff1ff22;--tint2:#7fa9c633}
body[data-w=storm]{--acc:#b59bff;--tint:#1a1030aa;--tint2:#0a0a1a88}
body.dusk{--tint:#ff7b4a33;--tint2:#7a2d6a44}
body.dark #tint{box-shadow:inset 0 0 0 100vmax #00081a66}
.glass{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.30),rgba(255,255,255,.07) 60%,rgba(255,255,255,.14));
 -webkit-backdrop-filter:blur(18px) saturate(1.9) brightness(1.08);backdrop-filter:blur(18px) saturate(1.9) brightness(1.08);
 border:1px solid rgba(255,255,255,.38);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.75),inset 0 -10px 18px rgba(255,255,255,.07),inset 0 0 0 1px rgba(255,255,255,.06),0 10px 30px rgba(0,20,40,.28);overflow:hidden}
.glass:before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 90px at var(--mx,30%) var(--my,0%),rgba(255,255,255,.45),transparent 70%);opacity:.55;transition:opacity .2s}
.glass:hover:before{opacity:1}
#ban{margin:14px 16px 0;border-radius:22px;height:28vh;min-height:130px;display:flex;align-items:center;justify-content:center}
#ban img{transition:opacity .25s,transform .25s;max-width:92%;max-height:78%;object-fit:contain;position:relative;filter:drop-shadow(0 2px 6px #0008)}
.bar{margin:10px 16px 0;border-radius:18px;display:flex;align-items:center;gap:10px;padding:6px 14px;font-size:13px}
.bar .sp{flex:1}
.chip,.bar button{border:0;color:#fff;font:800 12px 'Nunito',sans-serif;border-radius:12px;padding:3px 12px;cursor:pointer}
.bar button{position:relative}
.chip{background:var(--acc);color:#102030;text-shadow:none}
.bat{width:22px;height:11px;border:2px solid #fff;border-radius:2px;position:relative}.bat:after{content:"";position:absolute;inset:1px;background:var(--acc)}
#stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;min-height:0}
#row{display:flex;gap:26px;padding:34px 44px;max-width:100%;overflow-x:auto;scrollbar-width:none;perspective:900px}#row::-webkit-scrollbar{display:none}
.slot{flex:0 0 auto;width:clamp(96px,14vw,150px);aspect-ratio:1;border-radius:26px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;color:#ffffffaa;transition:transform .18s,margin .35s}
.slot img{width:62%;height:62%;object-fit:contain;border-radius:16px;position:relative;margin-bottom:24px}
.slot.has img{object-fit:cover;box-shadow:0 4px 14px #0005}
.slot img.ghost{opacity:.28;box-shadow:none;width:50%;height:50%}
.slot .lb{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 8px;font-size:clamp(13px,1.7vw,16px);font-weight:800;text-align:center;color:#fff;text-shadow:0 1px 5px #000d;background:linear-gradient(transparent,#000a);z-index:1;pointer-events:none}
.slot.sel{transform:scale(1.14);box-shadow:inset 0 1.5px 1px #fffc,0 0 0 3px var(--acc),0 0 28px -2px var(--acc),0 12px 30px #0004}
.slot.lnk:before{content:'↗';position:absolute;top:7px;right:10px;font-size:15px;z-index:2;text-shadow:0 1px 4px #0008;pointer-events:none}
.slot.live:after{content:"";position:absolute;top:9px;right:9px;width:11px;height:11px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.slot.spin{animation:spin 1.4s cubic-bezier(.5,0,.3,1) forwards;z-index:4}
@keyframes spin{0%{margin:0;transform:rotateY(0) scale(1.14)}40%{margin:0 min(80px,9vw)}100%{margin:0 min(80px,9vw);transform:rotateY(900deg) scale(1.45);opacity:.15}}
#nm{font-size:22px;font-weight:800;min-height:30px;text-align:center;padding:0 12px;text-shadow:0 2px 10px #000a}
.btns{display:flex;gap:12px}
.btn{border:0;border-radius:26px;padding:11px 34px;color:#fff;font:800 15px 'Nunito',sans-serif;cursor:pointer;transition:transform .15s}
.btn:hover:not(:disabled){transform:scale(1.06)}.btn:active:not(:disabled){transform:scale(.97)}
#play{background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 70%,transparent),color-mix(in srgb,var(--acc) 25%,transparent))}
.btn:disabled{opacity:.45;cursor:default}
#quit{display:none}#quit.show{display:block}
#logo{position:fixed;left:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));height:34px;opacity:.85;z-index:5;filter:drop-shadow(0 1px 4px #0008)}
#boot{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity 1.1s}
#boot.hide{opacity:0;pointer-events:none}
#sv{width:min(170px,38vw);opacity:0;transition:opacity .7s;background:#000}#sv.on{opacity:1}
#black{position:fixed;inset:0;z-index:35;background:#000;opacity:0;pointer-events:none;transition:opacity .7s}#black.on{opacity:1;pointer-events:all}
#game{position:fixed;inset:0;z-index:40;background:#000;display:none;color:#888;align-items:center;justify-content:center}
#game.show{display:flex}#game iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .5s}#game iframe.on{opacity:1}
#home{position:absolute;top:6px;left:6px;z-index:3;opacity:.4;border:0;border-radius:10px;padding:4px 10px;background:#222;color:#fff;font:800 12px 'Nunito',sans-serif;cursor:pointer}#home:hover,#tab:hover{opacity:1}#tab{position:absolute;top:6px;left:90px;z-index:3;opacity:.4;border:0;border-radius:10px;padding:4px 10px;background:#222;color:#fff;font:800 12px 'Nunito',sans-serif;cursor:pointer}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:4;padding:8px 18px;border-radius:16px;font-size:13px;opacity:0;transition:opacity .5s;pointer-events:none}
.slot.holding{animation:holdr .65s linear}@keyframes holdr{from{box-shadow:inset 0 0 0 0 var(--acc)}to{box-shadow:inset 0 0 0 6px var(--acc),0 0 26px var(--acc)}}
#lib,#store{position:fixed;inset:0;z-index:45;background:#0008;display:none;align-items:center;justify-content:center;padding:16px}#lib.show,#store.show{display:flex}
.panel{border-radius:24px;padding:18px;width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;gap:10px}
.lh{display:flex;align-items:center;gap:10px}.lh h2{margin:0;font-size:20px}.lh .sp{flex:1}.lh .btn{padding:7px 14px;font-size:13px}
#lq{padding:10px 14px;border-radius:14px;border:1px solid #fff6;background:#ffffff26;color:#fff;font:700 14px 'Nunito',sans-serif;outline:0;position:relative}#lq::placeholder{color:#fffa}
#ll{overflow:auto;display:flex;flex-direction:column;gap:6px;min-height:120px;position:relative}
.rom{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:14px;background:#ffffff1c;cursor:pointer;border:1px solid transparent}.rom:hover{background:#ffffff38;border-color:#fff6}
.rom b{font-size:10px;background:var(--acc);color:#102030;border-radius:8px;padding:2px 8px;text-shadow:none;min-width:52px;text-align:center}
#ln{margin:0;font-size:12px;opacity:.85}
#br{position:fixed;inset:0;z-index:40;background:#0b0d0e;display:none;flex-direction:column}#br.show{display:flex}
.tb{display:flex;gap:8px;padding:8px;margin:8px;border-radius:18px;align-items:center;flex:0 0 auto}
.tb button{border:0;border-radius:12px;padding:6px 12px;background:#ffffff26;color:#fff;font:800 14px 'Nunito',sans-serif;cursor:pointer;position:relative}.tb button:disabled{opacity:.35;cursor:default}
#burl{flex:1;min-width:0;padding:8px 14px;border-radius:14px;border:1px solid #fff5;background:#ffffff22;color:#fff;font:700 14px 'Nunito',sans-serif;outline:0;position:relative}#burl::placeholder{color:#fffa}
#bf{flex:1;border:0;background:#fff;min-height:0;margin:0 8px 8px;width:calc(100% - 16px);border-radius:12px}
#bhome{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%);border-radius:24px;padding:22px 28px;text-align:center;max-width:90vw}#bhome h2{margin:0 0 6px}#bhome p{margin:0 0 14px;font-size:13px;opacity:.9}
#bq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}#bq button{border:0;border-radius:14px;padding:8px 16px;background:#ffffff2e;color:#fff;font:800 13px 'Nunito',sans-serif;cursor:pointer;position:relative}
#ban #freeze{display:none;position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);max-width:none;max-height:none;object-fit:cover;filter:blur(12px) brightness(.6) saturate(1.2);z-index:0}
#ban.paused #freeze{display:block}#ban.paused #bimg{display:none}
#pbar{display:none;position:relative;z-index:2;flex-direction:column;align-items:center;gap:10px;text-align:center}
#ban.paused #pbar{display:flex}#ptitle{font-size:clamp(16px,2.4vw,22px);font-weight:800;text-shadow:0 2px 8px #000c}
#pbar .pb{display:flex;gap:12px}#pbar .btn{padding:8px 26px;font-size:14px}
#ld{display:none!important}
#loader{position:fixed;inset:0;z-index:44;background:radial-gradient(circle at 50% 40%,#16222b,#000 72%);display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px}
#loader.show{display:flex}#loader img{height:72px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.14);opacity:.55}}
#lbar{width:min(280px,62vw);height:10px;border-radius:6px;overflow:hidden;background:#ffffff22;border:1px solid #ffffff44}
#lfill{height:100%;width:0;background:linear-gradient(90deg,var(--acc),#fff);border-radius:6px}
#lfill.go{animation:fillbar var(--ms) linear forwards}@keyframes fillbar{to{width:100%}}
#ltxt{font-size:15px;font-weight:800;opacity:.9}
#off{position:fixed;inset:0;z-index:70;background:#000;display:none;align-items:center;justify-content:center;opacity:0;transition:opacity .45s}
#off.show{display:flex}#off.in{opacity:1}#off img{height:96px}
#br.srv #burl,#br.srv #bback,#br.srv #bfwd{display:none}#br.srv #bmenu{margin-right:auto}
#sl2{overflow:auto;display:flex;flex-direction:column;gap:8px;min-height:120px;position:relative}#sn{margin:0;font-size:12px;opacity:.85}
.srow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:#ffffff1c}
.srow img{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:0 0 auto}.srow .d{flex:1;min-width:0}.srow .d b{display:block;font-size:16px}.srow .d span{font-size:12px;opacity:.85}
.srow .btn{padding:8px 16px;font-size:13px}
.rx{margin-left:auto;border:0;background:#ffffff26;color:#fff;border-radius:8px;padding:2px 9px;cursor:pointer;font-size:13px}
.slot.locked img{filter:grayscale(1) brightness(.9);opacity:.6}.slot.locked{opacity:.85}
.slot .lk{display:none;position:absolute;top:8px;left:10px;font-size:17px;z-index:2;text-shadow:0 1px 4px #000a}.slot.locked .lk{display:block}
#modal{position:fixed;inset:0;z-index:50;background:#0007;display:none;align-items:center;justify-content:center;padding:16px}#modal.show{display:flex}
.card{border-radius:22px;padding:22px;width:min(360px,100%);display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:18px}.card p{margin:0;font-size:12px;opacity:.8}
.card input{position:relative;padding:10px;border-radius:12px;border:1px solid #fff6;background:#ffffff26;color:#fff;font:700 14px 'Nunito',sans-serif;outline:0}.card input::placeholder{color:#ffffffaa}
.card .row{display:flex;gap:8px}.card .btn{flex:1;padding:10px}
#err{color:#ffb3a8;font-size:12px;min-height:14px}
</style></head><body>
<video id="bg" muted loop playsinline></video><div id="tint"></div>
<div id="ban" class="glass"><img id="freeze" alt=""><img id="bimg" src="assets/banner.webp" alt=""><div id="pbar"><div id="ptitle"></div><div class="pb"><button class="btn glass" id="pcont">▶ Continue</button><button class="btn glass" id="pquit">⏹ Quit game</button></div></div></div>
<div class="bar glass"><span id="wx">…</span><span class="chip" id="who">Guest</span><span class="sp"></span><button class="glass" id="acct">⚙ Account</button><button class="glass" id="mus">♪ on</button><button class="glass" id="poff" title="Power off">⏻ Power</button><span id="clk"></span><div class="bat"></div></div>
<div id="stage"><div id="row"></div><div id="nm"></div><div class="btns"><button class="btn glass" id="play">▶ Play</button><button class="btn glass" id="quit">⏹ Quit game</button></div></div>
<img id="logo" alt="Narrow" src="assets/narrow.png">
<div id="boot"><video id="sv" src="assets/startup.mp4" playsinline preload="auto"></video></div>
<div id="black"></div>
<div id="loader"><img src="assets/narrow.png" alt=""><div id="lbar"><div id="lfill"></div></div><div id="ltxt"></div></div>
<div id="off"><img src="assets/narrow.png" alt=""></div>
<div id="game"><button id="home">☰ Menu</button><button id="tab" style="display:none">↗ Open in tab</button><div id="toast" class="glass">F1 or hold Esc: Narrow menu</div><span id="ld">Loading…</span></div>
<div id="br"><div class="tb glass"><button id="bmenu" title="Back to menu">☰</button><button id="bback">◀</button><button id="bfwd">▶</button><button id="brl">⟳</button><input id="burl" placeholder="Search or enter address" autocomplete="off" spellcheck="false"><button id="btab" title="Open in a new tab">↗</button><button id="bset" title="Proxy settings">⚙</button></div>
<iframe id="bf" allow="fullscreen; autoplay; clipboard-write"></iframe><div id="bhome" class="glass"><h2>Browser</h2><p id="bp">Search or type an address above.</p><div id="bq"></div></div></div>
<div id="modal"><div class="card glass" id="card"></div></div>
<div id="lib"><div class="panel glass"><div class="lh"><h2>My Games</h2><span id="lc"></span><span class="sp"></span><button class="btn glass" id="lfile">＋ Add files</button><button class="btn glass" id="lpick">📁 Choose folder / USB</button><button class="btn glass" id="lx">✕</button></div>
<input id="lq" placeholder="Search…"><div id="ll"></div><p id="ln">Pick a folder on your USB (or anywhere). Games are detected automatically by file type. Use games you own.</p></div></div>
<div id="store"><div class="panel glass"><div class="lh"><h2>Narrow Store</h2><span class="sp"></span><button class="btn glass" id="sx">✕</button></div><div id="sl2"></div><p id="sn"></p></div></div>
<input type="file" id="fin2" multiple style="display:none">
<input type="file" id="fin" webkitdirectory multiple style="display:none">
<audio id="a1" src="assets/music1.mp3" preload="auto"></audio><audio id="a2" src="assets/music2.mp3" preload="auto"></audio><audio id="a3" src="assets/music3.mp3" preload="auto"></audio><audio id="mn" src="assets/menu.mp3" preload="auto"></audio>
<audio id="ck" src="assets/click.mp3" preload="auto"></audio><audio id="sl" src="assets/select.mp3" preload="auto"></audio>
<script>
const $=id=>document.getElementById(id);
const CAT=[
 {id:'browser',def:1,name:'Browser',type:'browser',img:'assets/google-slot.png',banner:'assets/google-slot.png',bscale:.8},
 {id:'mygames',def:1,name:'My Games',type:'rom',needsAcc:1,img:'assets/usb-slot.svg',banner:'assets/roms-banner.svg'},
 {id:'store',def:1,name:'Narrow Store',type:'store',needsAcc:1,img:'assets/store-slot.svg',banner:'assets/store-banner.svg'},
 {id:'eagler',def:1,name:'Eaglercraft',img:'assets/eagler-slot.png',url:'game/eaglercraft.html',banner:'assets/banner.webp'},
 {id:'2048',def:1,name:'2048',img:'assets/2048-slot.png',url:'game/2048.html',banner:'assets/2048-banner.svg'},
 {id:'chess',def:1,name:'Chess',img:'assets/chess-slot.webp',url:'game/chess.html',banner:'assets/chess-banner.png',bfx:'brightness(0) invert(1) drop-shadow(0 2px 6px #0008)'},
 {id:'sandboxels',def:1,name:'Sandboxels',type:'link',img:'assets/sandboxels-banner.webp',url:'https://sandboxels.r74n.com/',banner:'assets/sandboxels-slot.png'},
 {id:'paperio2',store:1,name:'Paper.io 2',type:'link',desc:'Claim territory by drawing loops. Opens the official game in a new tab.',img:'assets/paper-slot.jpg',url:'https://www.crazygames.com/game/paper-io-2',banner:'assets/paper-banner.png',bscale:1.9},
 {id:'subway',store:1,name:'Subway Surfers',type:'link',desc:'Endless runner. Opens the official web version in a new tab.',img:'assets/subway-slot.webp',url:'https://poki.com/en/g/subway-surfers',banner:'assets/subway-banner.svg'}];
const GAMES=[];
let N=8;let sel=0,musicOn=true,busy=false,inGame=false,sess=null,vol=.4,li=0;
let acc=null;try{acc=JSON.parse(localStorage.getItem('narrow_acct')||'null')}catch(e){}
function accKey(){return acc?acc.name.toLowerCase():'guest'}
function getAdded(){if(!acc)return[];try{return JSON.parse(localStorage.getItem('narrow_lib_'+accKey())||'[]')}catch(e){return[]}}
function setAdded(a){try{localStorage.setItem('narrow_lib_'+accKey(),JSON.stringify(a))}catch(e){}}
document.addEventListener('pointermove',e=>{const g=e.target.closest&&e.target.closest('.glass');if(g){const r=g.getBoundingClientRect();g.style.setProperty('--mx',(e.clientX-r.left)+'px');g.style.setProperty('--my',(e.clientY-r.top)+'px')}});
/* ---------- audio ---------- */
const A=[$('a1'),$('a2'),$('a3')];const setVol=v=>{vol=v;A.forEach(t=>t.volume=v)};setVol(.4);
const list=()=>A;
A.forEach(t=>t.onended=()=>{const l=list();li=(li+1)%l.length;l[li].currentTime=0;play()});
function play(){if(!musicOn)return;const l=list();const t=l[li%l.length];t.play().catch(()=>{const f=()=>{play();removeEventListener('pointerdown',f);removeEventListener('keydown',f)};addEventListener('pointerdown',f);addEventListener('keydown',f)})}
function stopMusic(){A.forEach(t=>t.pause())}
function fade(to,ms,cb){const from=vol,t0=performance.now();(function f(n){const k=Math.min(1,(n-t0)/ms);setVol(from+(to-from)*k);k<1?requestAnimationFrame(f):cb&&cb()})(t0)}
function snd(id){const a=$(id);try{a.currentTime=0;a.volume=1;a.play().catch(()=>{})}catch(e){}}
$('mus').onclick=()=>{musicOn=!musicOn;$('mus').textContent='♪ '+(musicOn?'on':'off');musicOn?play():stopMusic()};
/* ---------- weather + time ---------- */
const VID={sunny:'sunny',night:'night',cloudy:'cloudy',rain:'rain',fog:'fog',snow:'snow',storm:'thunderstorm',nstorm:'night_thunderstorm'};
const LABEL={sunny:['☀','Sunny'],night:['☾','Clear night'],cloudy:['☁','Cloudy'],rain:['🌧','Rain'],fog:['🌫','Fog'],snow:['❄','Snow'],storm:['⛈','Thunderstorm']};
function cond(code){if(code<=1)return'clear';if(code<=3)return'cloudy';if(code<=48)return'fog';if(code<=67)return'rain';if(code<=77)return'snow';if(code<=82)return'rain';if(code<=86)return'snow';return'storm'}
function applyWx(c,isDay,temp){let key=c==='clear'?(isDay?'sunny':'night'):c==='cloudy'?(isDay?'cloudy':'night'):c;
 let file=VID[key];if(c==='storm')file=isDay?VID.storm:VID.nstorm;
 const lbl=LABEL[c==='clear'?key:c==='cloudy'&&isDay?'cloudy':c==='cloudy'?'night':c];
 document.body.dataset.w=c==='storm'?'storm':key;document.body.classList.toggle('dark',!isDay&&!['sunny','night'].includes(key)&&c!=='storm');
 const h=new Date().getHours();document.body.classList.toggle('dusk',isDay&&(h<8||h>=17));
$('wx').textContent=lbl[0]+' '+lbl[1]+(temp!=null?'  '+Math.round(temp)+'°C':'');
 const bg=$('bg'),src='assets/weather/'+file+'.mp4';if(!bg.src.endsWith(src)){bg.classList.remove('on');setTimeout(()=>{bg.src=src;bg.play().catch(()=>{})},bg.src?600:0)}}
$('bg').addEventListener('canplay',()=>$('bg').classList.add('on'));
async function weather(){const forced=location.hash.slice(1);
 const m={sunny:['clear',1],night:['clear',0],cloudy:['cloudy',1],rain:['rain',1],fog:['fog',1],snow:['snow',1],storm:['storm',1],nstorm:['storm',0]};

  runLoader(4000,'Loading '+r.name+'…',()=>sess&&sess.ready).then(()=>{f.classList.add('on');f.focus();toast({})})},1800)}
/* ---------- Narrow Store ---------- */
function openStore(){$('store').classList.add('show');renderStore()}
function closeStore(){$('store').classList.remove('show')}
function renderStore(){const l=$('sl2');l.innerHTML='';$('sn').textContent='Signed in as '+(acc?acc.name:'?')+'. Games you add show up on your home row.';const add=getAdded();
 CAT.filter(g=>g.store).forEach(g=>{const d=document.createElement('div');d.className='srow';const im=new Image();im.src=g.img;d.appendChild(im);
  const t=document.createElement('div');t.className='d';t.innerHTML='<b></b><span></span>';t.children[0].textContent=g.name;t.children[1].textContent=g.desc||'';d.appendChild(t);
  const has=add.includes(g.id),b=document.createElement('button');b.className='btn glass';b.textContent=has?'Added ✓ · Remove':'＋ Add';
  b.onclick=()=>{if(has&&sess){alert('Quit the game in progress before removing games.');return}const a=getAdded();setAdded(has?a.filter(x=>x!==g.id):a.concat(g.id));rebuildGames();renderStore()};
  d.appendChild(b);l.appendChild(d)})}
$('sx').onclick=closeStore;
addEventListener('keydown',e=>{if(e.key==='Escape'&&$('store').classList.contains('show')){e.stopPropagation();closeStore()}},true);
/* ---------- Browser (through your Cloudflare Worker) ---------- */
const PROXY_DEFAULT={url:'',key:'',server:''}; /* or hard-code your Worker address + key here */
let px=Object.assign({},PROXY_DEFAULT);try{Object.assign(px,JSON.parse(localStorage.getItem('narrow_proxy')||'{}'))}catch(e){}
let brOpen=false,hist=[],hi=-1,cur='',pend=false;
const pxUrl=t=>{const u=new URL(t);return px.url.replace(/\/+$/,'')+'/'+px.key+'/'+u.protocol.slice(0,-1)+'/'+u.host+u.pathname+u.search+u.hash};
function norm(v){v=v.trim();if(!v)return'';if(/^https?:\/\//i.test(v))return v;if(/^[^\s]+\.[a-z]{2,}([\/?#].*)?$/i.test(v))return'https://'+v;return'https://html.duckduckgo.com/html/?q='+encodeURIComponent(v)}
function navBtns(){$('bback').disabled=hi<=0;$('bfwd').disabled=hi>=hist.length-1}
function go(t,push=true){if(!t||px.server)return;if(!px.url||!px.key){proxySetup();return}let h;try{h=new URL(t).href}catch(e){return}
 if(push){hist=hist.slice(0,hi+1);hist.push(h);hi=hist.length-1}cur=h;pend=true;$('burl').value=h;$('bhome').style.display='none';$('bf').src=pxUrl(h);navBtns()}
addEventListener('message',e=>{const d=e.data;if(!d||!d.narrowNav||e.source!==$('bf').contentWindow)return;let u=d.narrowNav;try{u=new URL(u).href}catch(x){}
 if(pend){hist[hi]=u;pend=false}else if(u!==hist[hi]){hist=hist.slice(0,hi+1);hist.push(u);hi=hist.length-1}cur=u;$('burl').value=u;navBtns()});
$('burl').addEventListener('keydown',e=>{if(e.key==='Enter')go(norm($('burl').value))});
$('burl').addEventListener('focus',e=>e.target.select());
$('bback').onclick=()=>{if(hi>0){hi--;go(hist[hi],false)}};$('bfwd').onclick=()=>{if(hi<hist.length-1){hi++;go(hist[hi],false)}};
$('brl').onclick=()=>{if(px.server){const f=$('bf');f.src=f.src;return}if(cur)go(cur,false)};$('btab').onclick=()=>{if(px.server){window.open(px.server,'_blank','noopener');return}if(cur)window.open(cur,'_blank','noopener')};$('bset').onclick=proxySetup;
[['Wikipedia','https://en.wikipedia.org/'],['DuckDuckGo','https://html.duckduckgo.com/html/'],['Internet Archive','https://archive.org/'],['Hacker News','https://news.ycombinator.com/']].forEach(([n,u])=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>go(u);$('bq').appendChild(b)});
function proxySetup(){$('card').innerHTML=`<h2>Proxy settings</h2><p>A: your full proxy server (Scramjet/Ultraviolet) for heavy sites. B: your Cloudflare Worker plus its key. Saved on this device only.</p><input id="ps" placeholder="Full proxy server: https://your-server" value="${px.server||''}"><input id="pu" placeholder="Worker: https://yourname.workers.dev" value="${px.url||''}"><input id="pk" placeholder="Worker access key" value="${px.key||''}"><div id="err"></div><div class="row"><button class="btn glass" id="cx">Close</button><button class="btn glass" id="sv2">Save</button></div>`;$('modal').classList.add('show');
 $('cx').onclick=()=>$('modal').classList.remove('show');
 $('sv2').onclick=()=>{const sv=$('ps').value.trim().replace(/\/+$/,''),u=$('pu').value.trim().replace(/\/+$/,''),k=$('pk').value.trim();const okS=/^https:\/\//i.test(sv),okW=/^https:\/\//i.test(u)&&/^[A-Za-z0-9]+$/.test(k);if(!okS&&!okW){$('err').textContent='Enter an https:// server address, or a Worker address plus key.';return}
  px={server:okS?sv:'',url:okW?u:'',key:okW?k:''};try{localStorage.setItem('narrow_proxy',JSON.stringify(px))}catch(e){}$('modal').classList.remove('show');brMode();if(!px.server&&cur)go(cur,false)}}
function brMode(){const on=!!px.server;$('br').classList.toggle('srv',on);if(on){$('bhome').style.display='none';const f=$('bf');if(f.dataset.s!==px.server){f.dataset.s=px.server;f.src=px.server}}else if(!hist.length){$('bhome').style.display=''}}
function openBrowser(){busy=true;snd('sl');row.children[sel].classList.add('spin');fade(0,1200,stopMusic);setTimeout(()=>$('black').classList.add('on'),900);
 setTimeout(()=>{$('br').classList.add('show');brOpen=true;brMode();navBtns();const none=!px.url&&!px.server;if(!px.server&&!hist.length){$('bhome').style.display='';if(none)$('bp').textContent='First, add your proxy address with the ⚙ button.'}if(none)setTimeout(proxySetup,400);else if(!px.server&&!hist.length)$('burl').focus()},1700)}
function closeBrowser(){brOpen=false;$('black').classList.add('on');setTimeout(()=>{$('br').classList.remove('show');[...row.children].forEach(c=>c.classList.remove('spin'));$('black').classList.remove('on');setVol(0);play();fade(.4,1500);busy=false},750)}
$('bmenu').onclick=closeBrowser;
$('poff').onclick=()=>{if(busy||inGame||brOpen)return;busy=true;snd('ck');stopMusic();$('modal').classList.remove('show');const o=$('off');o.classList.add('show');requestAnimationFrame(()=>requestAnimationFrame(()=>o.classList.add('in')));setTimeout(()=>{try{window.close()}catch(e){}setTimeout(()=>location.replace('about:blank'),250)},1600)};
/* ---------- misc ---------- */
function clock(){const d=new Date();$('clk').textContent=d.toLocaleDateString('en',{month:'numeric',day:'numeric',weekday:'short'})+'  '+d.toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit',hour12:false})}clock();setInterval(clock,20000);
function who(){$('who').textContent=acc?acc.name:'Guest'}who();
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function setup(msg){$('card').innerHTML=`<h2>${acc?'Your Account':'Set up your account'}</h2><p>${msg||'Saved on this device only for now.'}</p><input id="n" placeholder="Username" value="${acc?acc.name:''}"><input id="em" type="email" placeholder="Email" value="${acc?acc.email:''}"><input id="pw" type="password" placeholder="Password"><div id="err"></div><div class="row"><button class="btn glass" id="cx">${acc?'Close':'Skip'}</button><button class="btn glass" id="sv2">Save</button></div>`;$('modal').classList.add('show');
 $('cx').onclick=()=>$('modal').classList.remove('show');
 $('sv2').onclick=async()=>{const n=$('n').value.trim(),e=$('em').value.trim(),p=$('pw').value;if(!n||!/^\S+@\S+\.\S+$/.test(e)||p.length<6){$('err').textContent='Enter a name, valid email and 6+ char password.';return}
 acc={name:n,email:e,h:await sha(p)};try{localStorage.setItem('narrow_acct',JSON.stringify(acc))}catch(x){}who();$('modal').classList.remove('show');rebuildGames()}}
function needAcc(m){setup(m)}
$('acct').onclick=()=>setup();$('who').onclick=()=>setup();
/* ---------- boot: 1s black -> logo video -> fade into home ---------- */
const sv=$('sv');let done=false;
function fin(){if(done)return;done=true;sv.classList.remove('on');setTimeout(()=>{$('boot').classList.add('hide');play();if(!acc)setTimeout(setup,1400)},700)}
function start(){sv.classList.add('on');sv.play().then(()=>{},()=>{sv.muted=true;sv.play().catch(fin)})}
sv.onended=fin;sv.onerror=fin;setTimeout(start,1000);
</script></body></html>
