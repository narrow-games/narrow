<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Chess</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{--bs:min(94vw,calc(100vh - 230px),520px);background:radial-gradient(circle at 25% 0,#2a4a57,#0f1a20);color:#eaf4f7;font-family:'Nunito','Segoe UI',system-ui,sans-serif;font-weight:700;display:flex;align-items:center;justify-content:center;overflow:hidden;user-select:none}
@media (min-width:900px){body{--bs:min(calc(100vh - 28px),calc(100vw - 380px),680px)}}
#wrap{display:flex;gap:22px;align-items:center;justify-content:center;width:100%;padding:12px}
@media (max-width:899px){#wrap{flex-direction:column;gap:12px}}
#board{width:var(--bs);height:var(--bs);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);border-radius:10px;overflow:hidden;box-shadow:0 14px 40px #0008,0 0 0 4px #ffffff22;flex:0 0 auto}
.sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer}
.sq.l{background:#e6f0f3}.sq.d{background:#7fa6b4}
.sq.last{box-shadow:inset 0 0 0 100px #ffe66d55}.sq.sel{box-shadow:inset 0 0 0 100px #4cd9a077}.sq.chk{box-shadow:inset 0 0 0 100px #ff4d4d99}
.sq.dest:after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:#1d3b2f66}
.sq.dest.cap:after{width:94%;height:94%;background:none;border:5px solid #1d3b2f77}
.co{position:absolute;font-size:calc(var(--bs)/8*.16);font-weight:800;opacity:.65;color:#17323b;pointer-events:none}.co.r{top:2px;left:3px}.co.f{bottom:1px;right:4px}
.pc{font-size:calc(var(--bs)/8*.8);line-height:1;font-family:"Segoe UI Symbol","Noto Sans Symbols 2","Apple Symbols","DejaVu Sans",sans-serif;pointer-events:none}
.pc.w{color:#fff;text-shadow:1px 0 0 #000,-1px 0 0 #000,0 1px 0 #000,0 -1px 0 #000,0 2px 4px #0008}
.pc.b{color:#14181c;text-shadow:0 1px 2px #fff8}
#panel{width:min(330px,94vw);display:flex;flex-direction:column;gap:10px}
.card{background:#ffffff14;border:1px solid #ffffff30;border-radius:18px;padding:12px 14px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#st{font-size:19px;font-weight:800;min-height:26px}#eng{font-size:12px;opacity:.75;margin-top:4px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row label{font-size:12px;opacity:.8}
button,select{border:0;border-radius:12px;padding:9px 14px;background:#ffffff26;color:#fff;font:800 14px 'Nunito','Segoe UI',sans-serif;cursor:pointer}
button:hover{background:#ffffff40}button.p{background:#35d07f;color:#08251a}select option{color:#000}
#ml{max-height:26vh;overflow:auto;font-size:13px;line-height:1.7}
#promo{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:5}#promo.show{display:flex}
#pbox{display:flex;gap:10px;background:#1b2a31;padding:16px;border-radius:18px}#pbox button{padding:4px 14px;background:#7fa6b4}
@media (max-width:899px){#panel{flex-direction:row;flex-wrap:wrap;justify-content:center}#panel .card{flex:1 1 150px}#ml{max-height:60px}}
</style></head><body>
<div id="wrap"><div id="board"></div>
<div id="panel"><div class="card"><div id="st">Loading…</div><div id="eng">Engine: checking…</div></div>
<div class="card"><div class="row"><label>You play</label><select id="side"><option value="w">White</option><option value="b">Black</option><option value="r">Random</option></select><label>Level</label><select id="lvl"><option value="0">Easy</option><option value="1">Medium</option><option value="2">Hard</option></select></div>
<div class="row" style="margin-top:8px"><button class="p" id="ng">New game</button><button id="un">Undo</button><button id="fl">Flip</button></div></div>
<div class="card"><div id="ml"></div></div></div></div>
<div id="promo"><div id="pbox"></div></div>

  if(p){const s=document.createElement('span');s.className='pc '+p.color;s.textContent=GLY[p.type];d.appendChild(s)}

/*AI*/
function bd(){const b=[];for(let r=0;r<8;r++){const row=[];for(let f=0;f<8;f++)row.push(g.get(FILES[f]+(8-r)));b.push(row)}return b}

function search(d,alpha,beta,ply,dl){if(Date.now()>dl)throw 'T';if(d===0)return evalPos();const ms=g.moves({verbose:true});if(!ms.length)return g.in_check()?-30000+ply:0;
 ms.sort((a,b)=>mscore(b)-mscore(a));let best=-Infinity;
 for(const m of ms){g.move(m);let v;try{v=-search(d-1,-beta,-alpha,ply+1,dl)}finally{g.undo()}if(v>best)best=v;if(best>alpha)alpha=best;if(alpha>=beta)break}return best}
function pickBuiltin(){const ms=g.moves({verbose:true});if(!ms.length)return null;const L=LB[level],dl=Date.now()+L.ms;ms.sort((a,b)=>mscore(b)-mscore(a));let best=null;
 for(let d=1;d<=L.d;d++){let bm=null,alpha=-Infinity;const sc=[];
  try{for(const m of ms){g.move(m);let v;try{v=-search(d-1,L.rand?-Infinity:-Infinity,L.rand?Infinity:-alpha,1,dl)}finally{g.undo()}sc.push([v,m]);if(v>alpha||!bm){alpha=Math.max(alpha,v);if(!bm||v>=alpha)bm=m}}best={sc:sc,bm:bm}}catch(e){if(e!=='T')throw e;break}}
 if(!best)return ms[Math.floor(Math.random()*ms.length)];
 if(L.rand){const mx=best.sc.reduce((a,x)=>Math.max(a,x[0]),-Infinity),top=best.sc.filter(x=>x[0]>=mx-L.rand);return top[Math.floor(Math.random()*top.length)][1]}
 let bv=-Infinity,bmv=best.bm;best.sc.forEach(x=>{if(x[0]>bv){bv=x[0];bmv=x[1]}});return bmv}
/*ENDAI*/
function ai(){thinking=true;const t=++tok;$('st').textContent='Opponent is thinking…';
 if(sfReady){const L=LV[level];sf._t=t;sf.postMessage('setoption name Skill Level value '+L.skill);sf.postMessage('position fen '+g.fen());sf.postMessage('go movetime '+L.ms);return}
 setTimeout(()=>{if(t!==tok)return;const m=pickBuiltin();thinking=false;if(m)doMove(m.from,m.to,m.promotion)},60)}
function onSF(l){l=l.trim();if(l.indexOf('bestmove')!==0)return;if(!thinking||sf._t!==tok)return;const mv=l.split(/\s+/)[1];thinking=false;
 if(!mv||mv==='(none)'||!doMove(mv.slice(0,2),mv.slice(2,4),mv.slice(4,5)||undefined)){const m=pickBuiltin();if(m)doMove(m.from,m.to,m.promotion)}}
async function initSF(){const cands=['chess/stockfish-19-lite-single.js','chess/stockfish-18-lite-single.js','chess/stockfish.js','chess/stockfish-19-asm.js'];
 for(const u of cands){try{const r=await fetch(u);if(!r.ok||/html/i.test(r.headers.get('content-type')||'')){continue}if(r.body)r.body.cancel();
  const w=new Worker(u);sf=w;
  await new Promise((res,rej)=>{const to=setTimeout(()=>rej('timeout'),12000);w.onmessage=ev=>{String(typeof ev==='string'?ev:ev.data).split('\n').forEach(l=>{l=l.trim();if(l==='uciok')w.postMessage('isready');else if(l==='readyok'){clearTimeout(to);res()}})};w.onerror=()=>rej('err');w.postMessage('uci')});
  w.onmessage=ev=>String(typeof ev==='string'?ev:ev.data).split('\n').forEach(onSF);sfReady=true;$('eng').textContent='Engine: Stockfish';return}catch(e){try{sf&&sf.terminate()}catch(x){}sf=null}}
 $('eng').textContent='Engine: built-in. Add Stockfish for a stronger Hard level (see game/chess/README.txt).'}
function newGame(){tok++;thinking=false;const s=$('side').value;me=s==='r'?(Math.random()<.5?'w':'b'):s;g.reset();over=false;sel=null;legal=[];last=null;flip=me==='b';render();listMoves();stat();if(g.turn()!==me)ai()}
function undo(){if(thinking)return;let n=g.turn()===me?2:1;n=Math.min(n,g.history().length);while(n--)g.undo();over=false;sel=null;legal=[];last=null;tok++;render();listMoves();stat();if(g.turn()!==me&&!over)ai()}
$('ng').onclick=newGame;$('un').onclick=undo;$('fl').onclick=()=>{flip=!flip;render()};
$('lvl').onchange=e=>{level=+e.target.value;try{localStorage.setItem('chess_lvl',level)}catch(x){}};
render();listMoves();stat();newGame();initSF();
